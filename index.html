<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Arb Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg:#0f1115; --card:#151923; --fg:#e8eaf0; --muted:#9aa3b2; --accent:#4aa3ff; --ok:#2ecc71; --warn:#ffb020; --line:#2a3141; --input:#0c0f14; }
    html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif}
    .wrap{max-width:520px;margin:12px auto 28px;padding:0 12px}
    .card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 10px 25px rgba(0,0,0,.35)}
    h1{margin:0 0 10px;font-size:20px}
    .meta{color:var(--muted);font-size:13px;margin:-2px 0 12px}
    .row{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
    @media (min-width:520px){ .row{grid-template-columns:1fr 1fr} }
    .field{display:flex;flex-direction:column;gap:6px}
    label{font-size:12px;color:var(--muted)}
    /* 👇 narrower inputs */
    input{
      width:100%; max-width: 240px; /* mobile */
      padding:14px 12px;border-radius:12px;border:1px solid var(--line);
      background:var(--input);color:var(--fg);font-size:16px;outline:none;
      -webkit-tap-highlight-color: transparent;
      align-self:flex-start; /* keep left aligned in wide layouts */
    }
    @media (min-width:520px){ input{ max-width:260px; } }
    input:focus{border-color:#394057;box-shadow:0 0 0 3px rgba(74,163,255,.15)}
    .hint{color:var(--muted);font-size:12px;margin-top:4px}
    .out{margin-top:14px;padding:12px;border-radius:12px;background:var(--input);border:1px solid var(--line)}
    .kpi{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted)}
    .status{margin-top:10px;font-weight:600}
    .ok{color:var(--ok)} .warn{color:var(--warn)} .fine{color:var(--accent)}
    footer{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
    /* Hide native spinners just in case */
    input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
    input[type=number]{ -moz-appearance:textfield; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Arb Calculator</h1>
    <div class="meta" id="meta"></div>

    <div class="row">
      <div class="field">
        <label id="l1">Odds 1</label>
        <input id="o1" type="text" inputmode="decimal" placeholder="e.g. 2.10" value="2.10" autocomplete="off" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label id="l2">Odds 2</label>
        <input id="o2" type="text" inputmode="decimal" placeholder="e.g. 1.80" value="1.80" autocomplete="off" autocapitalize="none" spellcheck="false">
      </div>
    </div>

    <div class="field">
      <label>Total stake (kr)</label>
      <input id="stake" type="text" inputmode="decimal" placeholder="e.g. 5000" value="5000" autocomplete="off" autocapitalize="none" spellcheck="false">
      <div class="hint">Enter decimals with “.” or “,” — updates happen as you type.</div>
    </div>

    <div class="out" id="out"></div>
  </div>
  <footer>Runs locally in Telegram • no data sent</footer>
</div>

<script>
  const tg = window.Telegram?.WebApp; try { tg?.expand(); } catch(e){}
  const $ = id => document.getElementById(id);
  const money = x => (Number.isFinite(x)?x:0).toLocaleString('sv-SE',{minimumFractionDigits:2,maximumFractionDigits:2});
  const clampMin = (x, min) => isFinite(x) ? Math.max(min, x) : min;

  function parseDec(el, min){
    const v = parseFloat((el.value || '').toString().replace(',', '.'));
    return clampMin(v, min);
  }

  function compute(o1, o2, S){
    if(o1<=1 || o2<=1 || S<=0) return {s1:0,s2:0,profit:0,roi:0,isArb:false};
    const s1 = S * (o2/(o1+o2));
    const s2 = S * (o1/(o1+o2));
    const payout = s1*o1;
    const profit = payout - S;
    const invsum = 1/o1 + 1/o2;
    return { s1, s2, profit, roi: profit/S, isArb: invsum < 1.0 };
  }

  function render(){
    const o1 = parseDec($('o1'), 1.01);
    const o2 = parseDec($('o2'), 1.01);
    const S  = parseDec($('stake'), 1);
    const r  = compute(o1,o2,S);
    const status = r.isArb ? '<span class="ok">✅ Arbitrage</span>' : '<span class="warn">⚠️ Not an arb</span>';
    $('out').innerHTML = `
      <div>Odds: <span class="fine">${o1.toFixed(2)}</span> / <span class="fine">${o2.toFixed(2)}</span></div>
      <div class="kpi"><span>Stake ${$('l1').textContent || 'Side 1'}</span><strong>${money(r.s1)} kr</strong></div>
      <div class="kpi"><span>Stake ${$('l2').textContent || 'Side 2'}</span><strong>${money(r.s2)} kr</strong></div>
      <div class="kpi"><span>Profit</span><strong>${money(r.profit)} kr</strong></div>
      <div class="kpi"><span>ROI</span><strong>${(r.roi*100).toFixed(2)}%</strong></div>
      <div class="status">${status}</div>
    `;
  }

  ['o1','o2','stake'].forEach(id=>{
    const el = $(id);
    el.addEventListener('input', render, {passive:true});
    el.addEventListener('blur', ()=>{
      const min = id==='stake'?1:1.01;
      const v = parseDec(el, min);
      el.value = (id==='stake') ? v.toFixed(0) : v.toFixed(2);
      render();
    });
  });

  // Prefill from query string: o1, o2, S, l1, l2, evt, mkt
  const p = new URL(location.href).searchParams;
  const qsO1 = p.get('o1'), qsO2 = p.get('o2'), qsS = p.get('S');
  const l1 = p.get('l1'), l2 = p.get('l2');
  const evt = p.get('evt'), mkt = p.get('mkt');
  if(l1) $('l1').textContent = l1;
  if(l2) $('l2').textContent = l2;
  if(evt || mkt) $('meta').textContent = `${evt?evt:''}${evt&&mkt?' • ':''}${mkt?mkt:''}`;
  if(qsO1) $('o1').value = qsO1;
  if(qsO2) $('o2').value = qsO2;
  if(qsS)  $('stake').value = qsS;

  render();
</script>
</body>
</html>
