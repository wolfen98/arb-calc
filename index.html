<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Arb Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg:#0f1115; --card:#151923; --fg:#e8eaf0; --muted:#9aa3b2; --accent:#4aa3ff; --ok:#2ecc71; --warn:#ffb020; --line:#2a3141; }
    html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif}
    .wrap{max-width:560px;margin:16px auto 32px;padding:0 12px}
    .card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 10px 25px rgba(0,0,0,.35)}
    h1{margin:0 0 12px;font-size:20px}
    .meta{color:var(--muted);font-size:13px;margin:-4px 0 10px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    .field{display:flex;flex-direction:column;gap:6px}
    label{font-size:12px;color:var(--muted)}
    input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0c0f14;color:var(--fg);font-size:16px}
    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
    .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
    button{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0c0f14;color:var(--fg);cursor:pointer}
    button:hover{border-color:#394057}
    .out{margin-top:14px;padding:12px;border-radius:12px;background:#0c0f14;border:1px solid var(--line)}
    .kpi{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted)}
    .status{margin-top:10px;font-weight:600}
    .ok{color:var(--ok)} .warn{color:var(--warn)} .fine{color:var(--accent)}
    footer{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Arb Calculator</h1>
    <div class="meta" id="meta"></div>

    <div class="row">
      <div class="field">
        <label id="l1">Odds 1</label>
        <input id="o1" type="number" step="0.01" min="1.01" value="2.10" inputmode="decimal">
        <div class="grid4">
          <button data-step="-0.10" data-target="o1">−0.10</button>
          <button data-step="-0.01" data-target="o1">−0.01</button>
          <button data-step="+0.01" data-target="o1">+0.01</button>
          <button data-step="+0.10" data-target="o1">+0.10</button>
        </div>
      </div>
      <div class="field">
        <label id="l2">Odds 2</label>
        <input id="o2" type="number" step="0.01" min="1.01" value="1.80" inputmode="decimal">
        <div class="grid4">
          <button data-step="-0.10" data-target="o2">−0.10</button>
          <button data-step="-0.01" data-target="o2">−0.01</button>
          <button data-step="+0.01" data-target="o2">+0.01</button>
          <button data-step="+0.10" data-target="o2">+0.10</button>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Total stake (kr)</label>
      <input id="stake" type="number" step="1" min="1" value="5000" inputmode="decimal">
      <div class="grid3">
        <button data-step="-500" data-target="stake">−500</button>
        <button data-step="-100" data-target="stake">−100</button>
        <button data-step="+100" data-target="stake">+100</button>
      </div>
    </div>

    <div class="out" id="out"></div>
  </div>
  <footer>Runs locally in Telegram • no data sent</footer>
</div>

<script>
  const tg = window.Telegram?.WebApp; try { tg?.expand(); } catch(e){}
  const $ = id => document.getElementById(id);
  const money = x => (Number.isFinite(x)?x:0).toLocaleString('sv-SE',{minimumFractionDigits:2,maximumFractionDigits:2});
  const clamp = (x, min) => Math.max(min, x);

  function compute(o1, o2, S){
    if(o1<=1 || o2<=1 || S<=0) return {s1:0,s2:0,profit:0,roi:0,isArb:false};
    const s1 = S * (o2/(o1+o2));
    const s2 = S * (o1/(o1+o2));
    const payout = s1*o1;
    const profit = payout - S;
    const invsum = 1/o1 + 1/o2;
    return { s1, s2, profit, roi: profit/S, isArb: invsum < 1.0 };
  }

  function render(){
    const o1 = parseFloat($('o1').value.toString().replace(',', '.'))||0;
    const o2 = parseFloat($('o2').value.toString().replace(',', '.'))||0;
    const S  = parseFloat($('stake').value.toString().replace(',', '.'))||0;
    const r  = compute(o1,o2,S);
    const status = r.isArb ? '<span class="ok">✅ Arbitrage</span>' : '<span class="warn">⚠️ Not an arb</span>';
    $('out').innerHTML = `
      <div>Odds: <span class="fine">${o1.toFixed(2)}</span> / <span class="fine">${o2.toFixed(2)}</span></div>
      <div class="kpi"><span>Stake ${$('l1').textContent || 'Side 1'}</span><strong>${money(r.s1)} kr</strong></div>
      <div class="kpi"><span>Stake ${$('l2').textContent || 'Side 2'}</span><strong>${money(r.s2)} kr</strong></div>
      <div class="kpi"><span>Profit</span><strong>${money(r.profit)} kr</strong></div>
      <div class="kpi"><span>ROI</span><strong>${(r.roi*100).toFixed(2)}%</strong></div>
      <div class="status">${status}</div>
    `;
  }

  ['o1','o2','stake'].forEach(id=>{
    $(id).addEventListener('input', render);
    $(id).addEventListener('change', e=>{
      const min = id==='stake'?1:1.01;
      const v = parseFloat(e.target.value)||min;
      e.target.value = clamp(v, min).toFixed(2);
      render();
    });
  });

  document.addEventListener('click', e=>{
    const btn = e.target.closest('button[data-step]');
    if(!btn) return;
    const step = parseFloat(btn.dataset.step);
    const target = $(btn.dataset.target);
    let v = parseFloat(target.value.toString().replace(',', '.')) || 0;
    v += step;
    const min = target.id==='stake'?1:1.01;
    target.value = clamp(v, min).toFixed(2);
    render();
  });

  // Prefill from query string: o1, o2, S, l1, l2, evt, mkt
  const p = new URL(location.href).searchParams;
  const qsO1 = p.get('o1'), qsO2 = p.get('o2'), qsS = p.get('S');
  const l1 = p.get('l1'), l2 = p.get('l2');
  const evt = p.get('evt'), mkt = p.get('mkt');
  if(l1) $('l1').textContent = l1;
  if(l2) $('l2').textContent = l2;
  if(evt || mkt) document.getElementById('meta').textContent = `${evt?evt:''}${evt&&mkt?' • ':''}${mkt?mkt:''}`;
  if(qsO1) $('o1').value = qsO1;
  if(qsO2) $('o2').value = qsO2;
  if(qsS)  $('stake').value = qsS;

  render();
</script>
</body>
</html>
